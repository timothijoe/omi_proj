schema_version: 1
resources:
  - id: omi-marvin-stand-axis-corrected-v1
    path: local/models/omi_marvin_stand_axis_corrected_v1
    tracked: false
    required_for: named_corrected_stand_model_archive
    source: User-supplied Marvin_Stand_2026.2.2.rar; OMI derived axis convention, NOT vendor original
    source_sha256: 5c4f24b0b445da411a4a030e16f544559f8d230cf93cf30109199c46df3e5bcd
    purpose: Named visualization-only URDF, original source URDF, 15 meshes and provenance; base/TCP/limits unverified
    restore: Transfer the entire directory including meshes, source and provenance. Runtime replay can regenerate corrected geometry from the source RAR using scripts/view_corrected_stand_observation_3d.sh; the named archive uses package mesh URIs. Vendor redistribution rights are unverified.
  - id: bag-bc-artifacts
    path: local/bc
    tracked: false
    required_for: bag_bc_training_and_shadow_inference
    source: User-supplied native-field MCAP/ZIP and local BC training
    purpose: NPZ episodes, observation-only MCAP, causal references, policy weights and reports
    restore: Re-export original bag using scripts/bag_bc.sh export, then train and shadow with new output directories. Rebuild matching marvin_msgs and install project bc extra, not a copied venv. No tactile SDK/model meshes required.
  - id: external-native-record001
    path: local/bags/record001.zip
    tracked: false
    required_for: external_native_field_and_eef_review
    source: User-supplied oct2/record001.zip external recording; restore from the original data owner
    purpose: Native tactile fields, camera, joint feedback and left end-effector pose review; not schema2 OMI sensor data
    restore: Copy the original ZIP or complete bag directory to a chosen data disk and pass its path to scripts/view_recorded_observation_3d.sh. The listed path is a suggested destination, not an already copied file. Also restore model assets and rebuild matching marvin_msgs.
  - id: recorded-review-generated-cache
    path: local/recorded_review
    tracked: false
    required_for: generated_review_only
    source: Offline read-only native bag renderer
    purpose: 10 Hz dashboard PNG and historical robot states; not a training dataset
    restore: Regenerate using view_recorded_observation_3d.sh; do not copy virtual environments or generated absolute-path URDFs between machines. Review runtime additionally uses local/robot_state/models and local/robot_state/viewer.env.
  - id: daimon-tactile-local-bundle
    path: local/vendor/daimon_tactile
    tracked: false
    required_for: tactile_image_reconstruction_and_live_sdk_acquisition
    source: Legally obtained Daimon SDK; encrypted implementation and native runtime remain unchanged
    purpose: Local runtime independent of the diamond reference checkout; per-file hashes in migration-manifest.json
    restore: Use python -m omi_sensors.vendor_bundle import SOURCE_SDK TARGET then verify TARGET. Match SDK Python/architecture; redistribution permission not verified.
  - id: tactile-reconstruction-golden-fixtures
    path: local/tactile/record010_offline_fields_confirmed_v3
    tracked: false
    required_for: tactile_migration_regression
    source: Archived record010 A/B infer inputs and historical CPU numeric fields at 23, 25.5 and 28 seconds
    purpose: Six NPZ samples for same-input before/after numeric and visual comparison
    restore: Restore the archived six a_*.npz and b_*.npz files plus the original record010_zero_load_25_26_confirmed_v2 baseline directory; do not regenerate the reference silently.
  - id: tactile-raw-replay-cache
    path: local/tactile/replay_cache
    tracked: false
    required_for: generated_tactile_bag_visualization_cache_not_transfer_requirement
    source: A/B raw CDR copied from source MCAP via private temporary decompression
    purpose: Avoid shared decompression collisions; raw-only record010 cache is about 110 MB. Combined mode creates a separate larger cache with camera RGB and tactile raw.
    restore: Run bash scripts/view_tactile_bag.sh BAG; first creation requires temporary space for the decompressed MCAP and the final raw-only cache.
  - id: tianji-a-mjcf-scene
    path: local/assets/robot_assets/mujoco/right_chopping_scene.xml
    tracked: false
    required_for: a_arm_simulation
    source: cooking_proj local simulation assets
    purpose: Marvin dual-arm MuJoCo scene; OMI controls left SDK A arm
    restore: Restore the complete cooking_proj local/assets/robot_assets tree under OMI local/assets, or use it externally; pass the XML with --scene or OMI_TIANJI_SCENE.
  - id: marvinccs-meshes
    path: local/assets/MarvinCCS
    tracked: false
    required_for: a_arm_simulation
    source: Tianji model assets referenced by cooking_proj scene
    purpose: Arm and base meshes loaded relative to the MJCF
    restore: Restore adjacent to robot_assets under the chosen assets root; verify redistribution rights before copying.
  - id: vendor-python-sdk
    path: ../TJ_FX_ROBOT_CONTRL_SDK/SDK_PYTHON
    tracked: false
    required_for: future_real_robot_only
    source: Tianji vendor SDK
    purpose: Controller API and matching native libraries
    restore: Keep the vendor repository beside omi_proj or set OMI_TIANJI_SDK_ROOT; TianjiConfig.sdk_root must point to the directory containing SDK_PYTHON. Match the site controller version before device use.
  - id: experiment-data
    path: data
    tracked: false
    required_for: generated_outputs
    source: OMI simulation commands
    purpose: JSONL, checkpoints, replay buffers, metrics, PNG and GIF
    restore: Regenerate with the documented commands; preserve important experiments separately before replacing output directories.
  - id: ros2-camera-clip-tools
    path: ../ros2_camera_clip_tools
    tracked: false
    required_for: legacy_external_camera_preview_only_not_omi_combined_viewer
    source: OMI workspace companion tool
    purpose: Play record010, crop the head and wrist ROIs, publish 128x128 RGB topics, and display the comparison dashboard in RViz.
    restore: Keep the tool beside omi_proj; use the workspace README and the tool README for entry points and ROI parameters.
  - id: record010-rosbag
    path: /home/zhoutong/Downloads/img/record010/bag_001
    tracked: false
    required_for: ros_observation_offline_validation
    source: Local Tianji multimodal recording
    purpose: Offline validation input for the synchronized ROS observation contract and camera ROI preview.
    restore: Restore the complete rosbag directory including metadata.yaml and compressed MCAP data; override this machine-local path in commands when stored elsewhere.
  - id: camera-roi-preview-images
    path: ../camera_roi_preview
    tracked: false
    required_for: camera_roi_visual_check
    source: Generated from local camera frames
    purpose: Static 128x128 head and wrist ROI previews; not a training dataset.
    restore: Regenerate from the camera ROI tool or source bag; do not treat the JPEG files as canonical observations.
  - id: record010-tactile-zero-load-baseline
    path: local/tactile/record010_zero_load_25_26_confirmed_v2
    tracked: false
    required_for: tactile_offline_reprocessing
    source: Generated from record010 at 25.0-26.0 seconds
    purpose: A/B temporal-median raw references, open-gripper contact sheet, timestamps and zero-load validation metadata.
    restore: Source scripts/env_ros.sh, then run tactile_baseline on record010 with --start-s 25 --end-s 26, A/right serial X26040546 and B/left serial X26040345; record that identity is externally confirmed rather than bag metadata.
  - id: daimon-offline-environment
    path: local/venvs/daimon312
    tracked: false
    required_for: tactile_offline_reprocessing
    source: Python 3.12 venv using system site packages plus h5py and gymnasium
    purpose: Import the local protected Daimon SDK and run CPU FlowTracker without constructing a Sensor.
    restore: Recreate a Python 3.12 environment with matching system/CPU SDK dependencies; h5py and gymnasium were additions to this host, not a complete dependency lock. The tested offline venv lacks grpc and is not qualified for live Flux acquisition. See tutorials/machine_transfer_checklist.md.
  - id: marvin-ros-message-source
    path: /home/zhoutong/Downloads/img/record001/bag_001_jazzy_tools/src/marvin_msgs
    tracked: false
    required_for: legacy_full_observation_joint_feedback_not_sdk_native_viewer
    source: Local reference ROS message source defining Jointfeedback
    purpose: Deserialize and subscribe to custom Tianji arm feedback; message definitions must match producer/bag
    restore: Obtain matching source and rebuild with the target ROS/Python; source that workspace overlay. Do not copy install/build between ROS distributions. No hardware feedback producer is supplied by this message package.
  - id: native-sensor-sessions
    path: local
    tracked: false
    required_for: sdk_native_recorded_data_replay
    source: OMI record command session directories
    purpose: Sensor bag plus session.json and recording_report.json
    restore: Transfer the selected complete session directory, including bag metadata and every data volume; do not copy all of local blindly.
  - id: record010-offline-tactile-fields
    path: local/tactile/record010_offline_fields_confirmed_v3
    tracked: false
    required_for: tactile_vector_visual_validation
    source: Generated from record010 raw and the 25-26 second temporal-median baseline
    purpose: Three-timepoint deformation, shear, reconstructed/recorded depth comparisons, wrench snapshots and dashboards.
    restore: Run omi_hil_rl.real.tactile_offline with record010, the generated baseline, and the local Daimon SDK root; no serial or device connection is required.

  - id: eef-action-experiment
    path: local/eef_bc
    tracked: false
    required_for: eef_proxy_bc_shadow_experiment
    source: User-supplied oct03/bag_004.zip, SHA256 0da32bb8ee8b5434af4f36cc87548afe26b12439e16a3eac2913f0473faece2c
    purpose: Versioned six-dimensional future-state proxy dataset, observations-only MCAP, weights and reports
    restore: Run scripts/eef_bc.sh export/train/shadow with new output directories; rebuild matching Marvin messages and ros2/omi_action_msgs. No robot model or tactile SDK required.
  - id: eef-action-ros-build
    path: local/action_ros
    tracked: false
    required_for: eef_typed_shadow_proposals
    source: Project ros2/omi_action_msgs
    purpose: Generated ROS message build, install and logs; not a portable binary asset
    restore: Rebuild with colcon following tutorials/eef_action_space.md; tested on Jazzy, Humble unverified.

  - id: eef-dual-camera-artifacts
    path: local/eef_bc
    tracked: false
    required_for: optional_wrist_eef_policy_experiment
    source: bag_004 with wrist-camera profile; derived wrist-absent observations used for fallback validation
    purpose: V2 fixed-shape RGB inputs, camera masks, selected-original-CDR replay caches, policy weights and verification reports
    restore: Export with scripts/eef_bc.sh export SOURCE OUTPUT --wrist-camera off/required/optional as documented in tutorials/eef_action_space.md; train matching checkpoints. Rebuild ROS action messages. Old unfiltered V2 trials are retained as failure evidence, not recommended replay caches.
