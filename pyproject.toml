[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omi-hil-rl"
version = "0.1.0"
description = "Tianji arm HIL RL simulation and hardware adapters"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "mujoco>=3.3,<4", "gymnasium>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
train = ["stable-baselines3>=2.9,<3"]
viz = ["pillow>=11,<13", "imageio>=2.37,<3"]
ros = ["PyYAML>=6,<7"]
bc = ["torch>=2.6,<3", "PyYAML>=6,<7"]
keypoints = ["pillow>=10,<13", "opencv-python-headless>=4.6,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"omi_hil_rl.sim" = ["assets/*.xml"]
"omi_hil_rl.keypoints" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ros2/omi_sensors"]
